# fail2ban filter: vulnerability-scanner signatures in the nginx access log.
# Deployed to /etc/fail2ban/filter.d/gamesbazaar-scanner.conf.
#
# Matches the request line only (never the referer / user-agent fields), any
# response status. fail2ban replaces the "[date]" with "[]" before matching.
# Signatures, from the 2026-09-08 scan and the everyday background noise:
#   time-based SQL injection  sleep(  waitfor delay  pg_sleep  dbms_pipe  benchmark(
#   union-select injection    union [all] select
#   quote-boolean injection   ' or 1=1   ' and 'a'='a   (quote, or/and, something=)
#   reflected XSS probes      <script  %3cscript
#   dead-CMS probes           wp-login.php  wp-admin  xmlrpc.php  .env  .git/  phpmyadmin  cgi-bin
# Percent signs are doubled because fail2ban's config parser interpolates "%".
# Test:  fail2ban-regex /var/log/nginx/access.log /etc/fail2ban/filter.d/gamesbazaar-scanner.conf

[Definition]
_sp = (?:%%20|\+| )
failregex = (?i)^<HOST> - \S+ \[\] "[A-Z]{3,10} [^"]*(?:sleep\(|waitfor%(_sp)s{1,3}delay|pg_sleep|dbms_pipe|benchmark\(|union%(_sp)s+(?:all%(_sp)s+)?select|(?:%%27|')%(_sp)s*(?:or|and)%(_sp)s+[^"&]*=|<script|%%3cscript|/wp-login\.php|/wp-admin|/xmlrpc\.php|/\.env|/\.git/|/phpmyadmin|/cgi-bin/)[^"]*" \d{3}
ignoreregex =
