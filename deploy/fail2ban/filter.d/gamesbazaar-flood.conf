# fail2ban filter: requests nginx rejected with 429 (limit_req in
# deploy/nginx/rate-limit.conf). Deployed to
# /etc/fail2ban/filter.d/gamesbazaar-flood.conf. The jail's maxretry sets how
# many rejections in a window mean "automated flood" rather than a busy CGNAT.
#
# ignoreregex: lines whose user agent names a search / AI crawler never count
# towards a flood ban. This is the one place a user agent is trusted, and only
# because the downside is small: a scanner spoofing "ChatGPT-User" escapes the
# 30-minute flood ban but is still throttled to 429s by nginx and still banned
# for 24 h by gamesbazaar-scanner the moment it sends a payload. Google, Bing,
# Apple and Yandex are additionally verified by reverse DNS in jail.local.

[Definition]
failregex = ^<HOST> - \S+ \[\] "[^"]*" 429
ignoreregex = (?i)"[^"]*(?:googlebot|google-inspectiontool|googleother|storebot-google|bingbot|gptbot|oai-searchbot|chatgpt-user|claudebot|anthropic-ai|perplexitybot|perplexity-user|applebot|amazonbot|meta-externalagent|facebookexternalhit|duckduckbot|yandexbot)[^"]*"$
