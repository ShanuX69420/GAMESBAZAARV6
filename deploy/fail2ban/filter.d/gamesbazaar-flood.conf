# fail2ban filter: requests nginx rejected with 429 (limit_req in
# deploy/nginx/rate-limit.conf). Deployed to
# /etc/fail2ban/filter.d/gamesbazaar-flood.conf. The jail's maxretry sets how
# many rejections in a window mean "automated flood" rather than a busy CGNAT.

[Definition]
failregex = ^<HOST> - \S+ \[\] "[^"]*" 429
ignoreregex =
