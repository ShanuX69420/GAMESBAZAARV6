# Per-IP request rate limits — the flood backstop in front of Next and Django.
#
# Lives here because geo/map/limit_req_zone are only valid in nginx's http
# context. Deployed to /etc/nginx/conf.d/rate-limit.conf, which nginx.conf
# already includes; gamesbazaar.conf fails `nginx -t` without it.
#
# Added 2026-09-08 after a vulnerability scanner (45.152.227.86) sent ~54,800
# requests in four hours. This limiter alone does NOT stop a polite scanner —
# that one averaged 7 requests/s with bursts of ~12/s, under these limits by
# design, because Pakistani ISPs put whole neighbourhoods behind one CGNAT
# address and a tight per-IP limit would hit real buyers. What it does: turns a
# flood into cheap 429s instead of Node/Django work, and every 429 is evidence
# for the fail2ban "gamesbazaar-flood" jail (deploy/fail2ban), which bans at
# the firewall. Scanners are caught by their payload signatures instead
# (fail2ban "gamesbazaar-scanner" jail).
#
# Exempt: the server itself. Next's server-side fetches reach
# api.gamesbazaar.pk from the droplet's own public IP, and the post-deploy
# cache warmer + local curl checks come from loopback. If the droplet's IP
# ever changes, update it here AND in deploy/fail2ban/jail.local (ignoreip),
# or the site will rate-limit its own page rendering.
geo $gb_limited {
    default         1;
    127.0.0.1       0;
    ::1             0;
    178.128.127.124 0;
}

# An empty key means "do not count this request" for limit_req.
map $gb_limited $gb_limit_key {
    0 "";
    1 $binary_remote_addr;
}

# Page routes on www (HTML + client navigations). Build assets (/_next/static)
# and optimised images (/_next/image) have their own location blocks with no
# limit — a single page load fetches 20-40 of them at once.
limit_req_zone $gb_limit_key zone=gb_pages:10m rate=15r/s;

# API routes on api.gamesbazaar.pk (browser XHR/fetch; SSR calls are exempt
# via the geo block above). Looser: a page view fans out to several calls.
limit_req_zone $gb_limit_key zone=gb_api:10m rate=30r/s;

limit_req_status 429;
limit_req_log_level warn;
